<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "../../site/node_modules/three/build/three.module.js", "three/addons/": "../../site/node_modules/three/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; background: #090b10; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .brand { position: fixed; top: 0; bottom: 0; display: none; flex-direction: column; justify-content: center; color: #f4f7fb;
           font-family: "Inter", "SF Pro Display", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .brand h1 { margin: 0; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  .brand p { margin: 16px 0 0; color: #a7b3c6; font-weight: 400; letter-spacing: -0.012em; line-height: 1.3; }
  .rule { position: fixed; left: 0; right: 0; bottom: 0; height: 3px; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="rule" id="rule"></div>
<div class="brand" id="brand"><h1 id="name"></h1><p id="tag"></p></div>
<script type="module">
  import { createSwarmLogo } from '../../site/app/lib/swarm-logo.js'
  const q = new URLSearchParams(location.search)
  const w = +q.get('w') || 720, h = +q.get('h') || 720
  const canvas = document.getElementById('c')
  const logo = createSwarmLogo({
    canvas, mark: q.get('mark') || 'glaux',
    distance: +q.get('distance') || 7,
    offsetY: +q.get('offsetY') || 0, offsetX: +q.get('offsetX') || 0,
    scale: +q.get('scale') || 1,
    galaxy: +q.get('galaxy') || 2.25,
    density: +q.get('density') || 1,
    capture: true,
  })
  logo.resize(w, h, +q.get('dpr') || 1)
  document.title = 'particles: ' + logo.particles
  if (q.get('name')) {
    const brand = document.getElementById('brand')
    brand.style.display = 'flex'
    brand.style.left = (+q.get('textLeft') || 76) + 'px'
    brand.style.width = (+q.get('textWidth') || 520) + 'px'
    const name = document.getElementById('name')
    name.textContent = q.get('name')
    name.style.fontSize = (+q.get('nameSize') || 120) + 'px'
    const tag = document.getElementById('tag')
    tag.innerHTML = (q.get('tag') || '').split('|').join('<br>')
    tag.style.fontSize = (+q.get('tagSize') || 30) + 'px'
    const rule = document.getElementById('rule')
    rule.style.display = 'block'
    rule.style.background = q.get('mark') === 'athenadb'
      ? 'linear-gradient(90deg, #818cf8, #2dd4bf)' : 'linear-gradient(90deg, #2dd4bf, #818cf8)'
  }
  window.frame = (t) => new Promise((done) => {
    logo.render(t)
    requestAnimationFrame(() => requestAnimationFrame(() => done(true)))
  })
  window.frame(0).then(() => { window.ready = true })
</script>
</body>
</html>
