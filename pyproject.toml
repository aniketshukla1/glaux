[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glaux-agent"
version = "1.0.0"
description = "A self-improving multi-agent swarm that proves its work — every action signed to a tamper-evident ledger"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aniket Shukla" }]
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "multi-agent", "llm", "swarm", "sandbox", "audit", "self-improving"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=42.0",
    "base58>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
docs = ["markdown>=3.5", "Pillow>=10.0"]  # website + demo GIF (scripts/build_site_docs.py, build_demo_gif.py)

[project.scripts]
glaux = "cli:main"
athena = "cli:main"  # pre-rename alias

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "paths", "safety"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
