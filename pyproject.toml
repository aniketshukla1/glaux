[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-agent"
version = "0.1.0"
description = "Self-improving multi-agent swarm with cryptographic identity, sandboxed skills, and curated self-improvement"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "base58>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
athena = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "safety"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
