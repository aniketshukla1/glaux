# Deploy the Next.js site (static export) to Netlify.
[build]
  base = "site"
  command = "npm run build"
  publish = "site/out"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
