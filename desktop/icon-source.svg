<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="230" y1="300" x2="800" y2="650">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="512" y1="80" x2="512" y2="944">
      <stop offset="0" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#06090f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="80" y="80" width="864" height="864" rx="208" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="208" fill="url(#glow)"/>
  <rect x="81.5" y="81.5" width="861" height="861" rx="206.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- owl of wisdom -->
  <g fill="none" stroke="url(#brand)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- ear tufts -->
    <path d="M286 408 L232 330"/>
    <path d="M738 408 L792 330"/>
    <!-- spectacle brow: a hump over each eye meeting in a centre valley -->
    <path d="M286 408 Q372 300 512 392 Q652 300 738 408"/>
    <!-- eyes -->
    <circle cx="384" cy="528" r="132"/>
    <circle cx="640" cy="528" r="132"/>
  </g>

  <!-- pupils + catch-light -->
  <circle cx="384" cy="536" r="46" fill="url(#brand)"/>
  <circle cx="640" cy="536" r="46" fill="url(#brand)"/>
  <circle cx="370" cy="520" r="13" fill="#ffffff" fill-opacity="0.92"/>
  <circle cx="626" cy="520" r="13" fill="#ffffff" fill-opacity="0.92"/>

  <!-- beak -->
  <path d="M512 542 L556 598 L512 660 L468 598 Z" fill="url(#brand)"/>
</svg>
