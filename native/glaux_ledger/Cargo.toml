[package]
name = "glaux_ledger"
version = "0.1.0"
edition = "2021"
description = "Native ledger kernel for Glaux: signed, hash-chained, tamper-evident action log (Ed25519 + SHA-256), canonicalization, and persistence."

[lib]
name = "glaux_ledger"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
# Cargo strips release builds by default, and on recent macOS the stripped dylib
# fails to load ("mis-aligned LINKEDIT string pool"). Keep the symbols.
strip = false
