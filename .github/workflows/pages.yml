name: Deploy site

on:
  push:
    branches: [main, master]
    paths: ["site/**", "docs/**", "scripts/build_site_docs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Regenerate docs pages from the canonical markdown
        run: |
          python -m pip install --upgrade pip markdown
          python scripts/build_site_docs.py

      - name: Build the Next.js site (static export)
        working-directory: site
        env:
          # GitHub Pages serves a project site under /<repo>; a custom domain does not.
          NEXT_PUBLIC_BASE_PATH: /glaux
          NEXT_PUBLIC_SITE_URL: https://aniketshukla1.github.io/glaux
        run: |
          npm ci
          npm run build
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
